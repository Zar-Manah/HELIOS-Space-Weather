name: HELIOS CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Core Verification Suite
      run: |
        python -m unittest tests/test_helios_core.py -v

    - name: Smoke Test CLI Inferences
      run: |
        python predict.py --sample moderate --json
        python predict.py --cme-speed 1200 --halo --json
